<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لحظة بلحظة | أخبار</title>
<style>
:root{--bg:#f1f5f9;--sf:#fff;--tx:#0f172a;--mu:#5b6b82;--bd:#e2e8f0;--red:#dc2626;--gr:#10b981}
:root.dark{--bg:#0a0f1e;--sf:#121c33;--tx:#f1f5f9;--mu:#93a4bd;--bd:#1e2c4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;margin:0}
.live{font-size:12px;color:var(--gr);font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px 16px 48px}
button,input{font:inherit;color:inherit}
.row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:9px 16px}
.btn{background:var(--red);color:#fff;border:0;border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer}
.ico{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;cursor:pointer}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
nav button{flex-shrink:0;background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:7px 16px;font-weight:700;color:var(--mu);cursor:pointer}
nav button.on{background:var(--red);border-color:var(--red);color:#fff}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:6px 0;font-size:17px;line-height:1.7}
.card p{margin:4px 0;color:var(--mu);font-size:14px;line-height:1.8}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--mu)}
.tag{font-size:11px;font-weight:700;color:var(--gr)}
a{color:inherit}
a.src{color:var(--gr);font-weight:700;text-decoration:none}
.msg{text-align:center;color:var(--mu);padding:40px 0}
.big{font-size:38px;font-weight:800}
.days{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.day{background:var(--bg);border-radius:10px;padding:8px 12px;text-align:center;min-width:72px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>لحظة بلحظة <span style="color:var(--mu);font-weight:400">| أخبار</span></h1>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="live" id="upd">…</span>
    <button class="ico" id="theme" aria-label="تبديل الوضع">🌙</button>
  </div>
</header>
<main>
  <div class="row">
    <input id="q" type="search" placeholder="ابحث في الأخبار..." aria-label="بحث">
    <button class="btn" id="ref">تحديث</button>
  </div>
  <nav id="tabs"></nav>
  <div id="out"></div>
</main>
<script>
const API = "";
const TABS = [["all","الكل"],["saved","المحفوظات"],["chad","تشاد"],["world","العالم"],["economy","اقتصاد"],["sports","رياضة"],["tech","تكنولوجيا"],["services","خدمات"]];
const CAT = {chad:"تشاد",world:"العالم",economy:"اقتصاد",sports:"رياضة",tech:"تكنولوجيا"};
let cat = "all", items = [], saved = load("saved", []), timer;
const $ = id => document.getElementById(id);

function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e }
function ago(ts){
  if(!ts) return "";
  const m = Math.max(0, Math.round((Date.now()/1000 - ts)/60));
  if(m < 1) return "الآن";
  if(m < 60) return `منذ ${m} دقيقة`;
  const h = Math.round(m/60);
  return h < 24 ? `منذ ${h} ساعة` : `منذ ${Math.round(h/24)} يوم`;
}
const safe = u => /^https?:\/\//.test(u || "") ? u : "#";

function tabs(){
  const nav = $("tabs"); nav.replaceChildren();
  TABS.forEach(([k, label]) => {
    const b = el("button", k === cat ? "on" : "", label);
    b.onclick = () => { cat = k; tabs(); render(); if(k !== "saved" && k !== "services") fetchNews(); };
    nav.append(b);
  });
}

function card(it){
  const c = el("article", "card");
  c.append(el("span", "tag", CAT[it.category] || ""));
  const h = el("h3"); const a = el("a", "", it.title); a.href = safe(it.link); a.target = "_blank"; a.rel = "noopener noreferrer"; h.append(a);
  c.append(h);
  if(it.summary) c.append(el("p", "", it.summary));
  const m = el("div", "meta");
  const s = el("span"); const sa = el("a", "src", it.source + " ↗"); sa.href = safe(it.link); sa.target = "_blank"; sa.rel = "noopener noreferrer";
  s.append(sa, " · " + ago(it.ts));
  const isSaved = saved.some(x => x.link === it.link);
  const b = el("button", "ico", isSaved ? "★ محفوظ" : "☆ حفظ");
  b.onclick = () => {
    saved = isSaved ? saved.filter(x => x.link !== it.link) : [it, ...saved];
    store("saved", saved); render();
  };
  m.append(s, b); c.append(m);
  return c;
}

const WX = c => c === 0 ? "☀️" : c <= 3 ? "⛅" : c <= 48 ? "🌫️" : c <= 82 ? "🌧️" : "⛈️";
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

async function services(){
  const out = $("out"); out.replaceChildren(el("p", "msg", "جاري التحميل…"));
  try {
    const d = await (await fetch(API + "/api/services")).json();
    out.replaceChildren();
    const w = d.weather, r = d.rates;
    if(w){
      const c = el("section", "card"); c.append(el("h3", "", "طقس أنجمينا"));
      c.append(el("div", "big", `${WX(w.current.weather_code)} ${Math.round(w.current.temperature_2m)}°م`));
      c.append(el("p", "", `الرطوبة ${w.current.relative_humidity_2m}% · الرياح ${Math.round(w.current.wind_speed_10m)} كم/س`));
      const days = el("div", "days");
      w.daily.time.forEach((t, i) => {
        const x = el("div", "day");
        x.append(el("div", "", DAYS[new Date(t).getDay()]), el("div", "", WX(w.daily.weather_code[i])), el("b", "", Math.round(w.daily.temperature_2m_max[i]) + "°"));
        days.append(x);
      });
      c.append(days); out.append(c);
    }
    if(r){
      const c = el("section", "card"); c.append(el("h3", "", "العملات مقابل الفرنك الأفريقي (XAF)"));
      c.append(el("p", "", `1 دولار ≈ ${Math.round(r.USD_XAF)} فرنك`), el("p", "", `1 يورو = ${r.EUR_XAF} فرنك (سعر ثابت رسمي)`));
      c.append(el("p", "", "الأسعار استرشادية وليست أسعار الصرافة المحلية."));
      out.append(c);
    }
    if(!w && !r) out.append(el("p", "msg", "تعذر جلب البيانات الآن، حاول لاحقاً."));
  } catch { out.replaceChildren(el("p", "msg", "تعذر الاتصال بالخادم.")) }
}

function render(){
  if(cat === "services") return services();
  const q = $("q").value.trim();
  const list = (cat === "saved" ? saved : items).filter(i => !q || i.title.includes(q) || (i.summary || "").includes(q));
  const out = $("out"); out.replaceChildren();
  if(!list.length) out.append(el("p", "msg", cat === "saved" ? "لم تحفظ أي خبر بعد." : "لا توجد أخبار مطابقة."));
  list.forEach(i => out.append(card(i)));
}

async function fetchNews(){
  if(cat === "saved" || cat === "services") return;
  try {
    const d = await (await fetch(`${API}/api/news?category=${cat}`)).json();
    items = d.items;
    $("upd").textContent = "● مباشر";
    render();
  } catch {
    $("upd").textContent = "غير متصل";
    if(!items.length) $("out").replaceChildren(el("p", "msg", "تعذر الاتصال بالخادم. تأكد من تشغيله."));
  }
}

$("q").oninput = render;
$("ref").onclick = fetchNews;
$("theme").onclick = () => { const d = document.documentElement.classList.toggle("dark"); store("dark", d); $("theme").textContent = d ? "☀️" : "🌙" };
if(load("dark", true)){ document.documentElement.classList.add("dark"); $("theme").textContent = "☀️" }
tabs(); fetchNews();
timer = setInterval(fetchNews, 60000);
</script>
</body>
</html>
